[project]
name = "pawlock"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "arislomovic", email = "arislomovic@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "evdev>=2.0.0 ; sys_platform == 'linux'",
    "pillow>=13.0.0",
    "pyobjc-framework-quartz>=13.0 ; sys_platform == 'darwin'",
    "pystray>=0.19.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
pawlock = "pawlock:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
